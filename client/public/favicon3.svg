<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"></stop>
      <stop offset="100%" stop-color="#FF9800"></stop>
    </linearGradient>

    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#cfd8dc"></stop>
    </linearGradient>

    <linearGradient id="rainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"></stop>
      <stop offset="100%" stop-color="#0288D1"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0F172A"></rect>

  <!-- Sun -->
  <circle cx="45" cy="42" r="20" fill="url(#sunGradient)"></circle>

  <!-- Sun Rays -->
  <g stroke="#FFC107" stroke-width="4" stroke-linecap="round">
    <line x1="45" y1="10" x2="45" y2="0"></line>
    <line x1="45" y1="84" x2="45" y2="74"></line>
    <line x1="13" y1="42" x2="3" y2="42"></line>
    <line x1="87" y1="42" x2="97" y2="42"></line>

    <line x1="22" y1="19" x2="14" y2="11"></line>
    <line x1="68" y1="65" x2="76" y2="73"></line>

    <line x1="22" y1="65" x2="14" y2="73"></line>
    <line x1="68" y1="19" x2="76" y2="11"></line>
  </g>

  <!-- Cloud -->
  <g>
    <circle cx="68" cy="58" r="20" fill="url(#cloudGradient)"></circle>
    <circle cx="90" cy="60" r="16" fill="url(#cloudGradient)"></circle>
    <circle cx="50" cy="65" r="16" fill="url(#cloudGradient)"></circle>

    <rect x="38" y="58" width="68" height="24" rx="12" fill="url(#cloudGradient)"></rect>
  </g>

  <!-- Rain -->
  <g fill="url(#rainGradient)">
    <path d="M52 94 C52 88, 58 88, 58 94 C58 100, 52 100, 52 94Z"></path>
    <path d="M72 100 C72 94, 78 94, 78 100 C78 106, 72 106, 72 100Z"></path>
    <path d="M92 94 C92 88, 98 88, 98 94 C98 100, 92 100, 92 94Z"></path>
  </g>

  <!-- Lightning -->
  <polygon points="78,70 66,92 78,92 70,112 96,84 82,84 90,70" fill="#FFEB3B"></polygon>
</svg>